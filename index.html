<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stable Pro Counter</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#f4f6f9;
}

canvas{
  width:90%;
  max-width:420px;
  border:3px solid #333;
  border-radius:10px;
}

video{
  display:none;
}

input{
  padding:8px;
  font-size:16px;
  width:160px;
  margin:5px;
}

button{
  padding:10px 18px;
  font-size:16px;
  margin:5px;
  border:none;
  border-radius:6px;
  background:#007bff;
  color:white;
}

#count{
  font-size:30px;
  font-weight:bold;
  margin-top:15px;
}
</style>
</head>

<body>

<h2>Stable Pro Counter</h2>

<input type="number" id="minArea" placeholder="Min Area">
<input type="number" id="maxArea" placeholder="Max Area">
<br>

<button onclick="startProcess()">เริ่ม</button>
<button onclick="stopProcess()">หยุด</button>

<div id="count">จำนวน: 0</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let intervalId;
let streaming = false;
let history = [];

// เปิดกล้องหลัง
navigator.mediaDevices.getUserMedia({
  video:{
    facingMode:{ ideal:"environment" },
    width:{ ideal:640 },
    height:{ ideal:480 },
    frameRate:{ ideal:15, max:15 }
  }
})
.then(stream=>{
  video.srcObject = stream;
  video.play();
})
.catch(err=>{
  alert("เปิดกล้องไม่ได้: " + err);
});

video.addEventListener("loadedmetadata",()=>{
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  streaming = true;
});

function startProcess(){
  if(!streaming) return;
  intervalId = setInterval(processFrame, 500);
}

function stopProcess(){
  clearInterval(intervalId);
}

function updateStableCount(newCount){
  history.push(newCount);
  if(history.length > 5){
    history.shift();
  }
  let avg = Math.round(
    history.reduce((a,b)=>a+b,0) / history.length
  );
  document.getElementById("count").innerText = "จำนวน: " + avg;
}

function processFrame(){

  if(typeof cv === "undefined" || !streaming) return;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  let src = cv.imread(canvas);

  // ROI ลดพื้นที่คำนวณ
  let roi = src.roi(
    new cv.Rect(
      src.cols*0.15,
      src.rows*0.15,
      src.cols*0.7,
      src.rows*0.7
    )
  );

  let gray = new cv.Mat();
  let thresh = new cv.Mat();

  cv.cvtColor(roi, gray, cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray, gray, new cv.Size(3,3), 0);

  // Adaptive Threshold กันแสงเปลี่ยน
  cv.adaptiveThreshold(
    gray,
    thresh,
    255,
    cv.ADAPTIVE_THRESH_GAUSSIAN_C,
    cv.THRESH_BINARY_INV,
    11,
    2
  );

  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();
  cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  let count = 0;

  let minA = parseInt(document.getElementById("minArea").value) || 800;
  let maxA = parseInt(document.getElementById("maxArea").value) || 20000;

  for(let i=0;i<contours.size();i++){
    let cnt = contours.get(i);
    let area = cv.contourArea(cnt);

    if(area > minA && area < maxA){
      count++;
    }
  }

  updateStableCount(count);

  src.delete();
  roi.delete();
  gray.delete();
  thresh.delete();
  contours.delete();
  hierarchy.delete();
}

</script>

</body>
</html>
